<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Legal Aid Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #17365d;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .container h2 {
            text-align: center;
            color: #17365d;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            background-color: #17365d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d2745;
        }

        footer {
            background-color: #17365d;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 80px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Legal Aid Portal</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/rights">Rights</a>
            <a href="/laws">Laws</a>
            <a href="/contact">Contact</a>
            <a href="/legal-aid">Legal Aid</a>
<a href="/login">Login</a>
<a href="/register">Register</a>
        </nav>
    </header>

    <div class="container">

        <h2>Contact Us</h2>

        <form method="POST" action="/contact">

            <label for="name">Name</label>
            <input type="text" id="name" name="name"
       placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
       placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
       placeholder="Enter subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message"
          placeholder="Enter your message" required></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

    <footer>
        <p>© 2026 Legal Aid & Rights Awareness Portal</p>
    </footer>

</body>
</html>
