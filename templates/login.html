<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7fb;
        text-align: center;
        padding-top: 60px;
    }
</style>
</head>
<body>

    <h1>Legal Aid & Rights Awareness Portal</h1>
    <h2>User Login</h2>
<div style="background:white; width:350px; margin:30px auto; padding:30px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.1);"></div>
    <form method="POST">

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Login</button>

    </form>
</div>
    </body>

    <br>

    <p>Don't have an account?</p>
    <a href="/register">Register here</a>

</body>
</html>
